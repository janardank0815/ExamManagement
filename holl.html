<html lang="en">

<body>

        <img src="sai.jpg" alt="icre.jpeg">

        <h1>Hall Ticket Upload</h1>
        <form action="holl.php" method="post">
            <div class="form-group">
                <label for="Student_name">Student Name:</label>
                <input type="text" id="Student_name" name="Student_name" required>
            </div>

            <div class="form-group">
                <label for="enrollment_number">Enrollment Number:</label>
                <input type="text" id="enrollment_number" name="enrollment_number" required>
            </div>

            <div class="form-group">
                <label for="hall_ticket_file">Hall Ticket Link:</label>
                <input type="text" id="hall_ticket_file" name="hall_ticket_file" required>
            </div>

            <input type="submit" value="Submit" class="btn">
        </form>
    </div>
