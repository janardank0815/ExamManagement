  function setcookie()
  {
    var user = document.getElementById("user1").value;
    var pass = document.getElementById("pass1").value;
    
    document.cookie = "myusername="+user+"; path=http://localhost/EXAM MANAGEMENT/";
    document.cookie = "mypass="+pass+"; path=http://localhost/EXAM MANAGEMENT/";
  }
  function getcookiedata()
  {
    console.log(document.cookie);
    var u = getcookie("myusername");
    var p = getcookie("mypass");
     document.getElementById("user1").value = u;
     document.getElementById("pass1").value = p;
  }
  function getcookie(cname)
  {
    var name = cname+"=";
    var decodedCookie = decodeURIComponent(document.cookie);
    var ca = decodedCookie.split(";");
    for(var i=0; i<ca.length; i++)
    {
      var c = ca[i];
      while(c.charAt(0)==' ')
      {
        c= c.substring(1);
      }
      if(c.indexOf(name)==0)
      {
        return c.substring(name.length, c.length);
      }
    }
    return "";
  }
  
 </script>
