<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="addstd.css">
</head>

<body>
    
    <div class="container">
        <h1>Sai Computers</h1>

      
        <img src="sai.jpg" alt="" class="school-logo">

        <h2>Add Student</h2>

        <form action="addstd.php" method="post" id="student-form">
            <div class="form-group">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" name="studentName" required>
            </div>

            <div class="form-group">
                <label for="seatNo">Seat No:</label>
                <input type="text" id="seatNo" name="seatNo" required>
            </div>

            <div class="form-group">
                <label for="enrollmentNo">Enrollment No:</label>
                <input type="text" id="enrollmentNo" name="enrollmentNo" required>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number:</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required>
            </div>

            <div class="form-group">
                <label for="email">Email ID:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="course">Course:</label>
                <input type="text" id="course" name="course" required>
            </div>

            <div class="form-group">
                <label for="semester">Semester:</label>
                <input type="text" id="semester" name="semester" required>
            </div>

            <div class="form-group">
                <label for="address">Student Address:</label>
                <textarea id="address" name="address" required></textarea>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label for="currentSubjects">Subjects of Current Semester:</label>
                <textarea id="currentSubjects" name="currentSubjects"></textarea>
            </div>

            <div class="form-group">
                <label for="backlogSubjects">Backlog Subjects:</label>
                <textarea id="backlogSubjects" name="backlogSubjects"></textarea>
            </div>

            <input type="submit" value="Add Student" name="add_student_btn">
        </form>
    </div>
</body>

</html>
