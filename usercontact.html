<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
        }
        .contact-info {
            margin-top: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .contact-info a {
            text-decoration: none;
            color: #333;
            transition: color 0.3s;
        }
        .contact-info a:hover {
            color: #007bff;
        }
        .social-logo {
            width: 50px;
            height: 50px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p>We're available on the following platforms:</p>
        <div class="contact-info">
            <a href="https://www.instagram.com/mr_varun1314_official" target="_blank">
                <img src="instagram.png" alt="Instagram" class="social-logo">
                <h4>Instagram</h4>
            </a>
            <a href="https://www.facebook.com/varun sanjay Varute" target="_blank">
                <img src="facebook.png" alt="Facebook" class="social-logo">
                <h4>Facebook</h4>
            </a>
            <a href="https://www.linkedin.com/in/your_account_name" target="_blank">
                <img src="linkedin.png" alt="LinkedIn" class="social-logo">
                <h4>LinkedIn</h4>
            </a>
        </div>
    </div>
</body>
</html>
